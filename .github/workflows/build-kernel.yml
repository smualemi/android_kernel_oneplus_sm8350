name: Build Stock Kernel & Modules (OnePlus 9 Pro - Android 14)

on:
  workflow_dispatch:

env:
  # ── Kernel source (YOUR fork, config already inside) ──────────────────────
  KERNEL_REPO: https://github.com/smualemi/android_kernel_oneplus_sm8350.git
  KERNEL_BRANCH: oneplus/sm8350_u_14.0.0_oneplus9

  # ── Vendor modules + device tree (OnePlus OSS upstream) ───────────────────
  VENDOR_REPO: https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8350.git
  VENDOR_BRANCH: oneplus/sm8350_u_14.0.0_oneplus9

  # ── Config path inside the kernel tree ────────────────────────────────────
  DEFCONFIG: vendor/lahaina-qgki_defconfig

  # ── Clang r383902b1 direct tarball (matches your extracted device config) ─
  # Size ~500 MB — fast, no full-repo clone needed
  CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902b1.tar.gz

  # ── Output zip name ───────────────────────────────────────────────────────
  ZIP_NAME: Stock-Base-OP9Pro-$(date +%Y%m%d).zip

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    # Kernel builds can take a while — increase if needed
    timeout-minutes: 120

    steps:
    # ────────────────────────────────────────────────────────────────────────
    # 1. Kernel source  (YOUR fork — defconfig is already committed inside it)
    # ────────────────────────────────────────────────────────────────────────
    - name: Clone kernel source (forked repo)
      run: |
        git clone ${{ env.KERNEL_REPO }} \
          --depth=1 \
          --branch ${{ env.KERNEL_BRANCH }} \
          $GITHUB_WORKSPACE/kernel_source

    # ────────────────────────────────────────────────────────────────────────
    # 2. Vendor modules + device tree
    # ────────────────────────────────────────────────────────────────────────
    - name: Clone vendor modules & device tree
      run: |
        git clone ${{ env.VENDOR_REPO }} \
          --depth=1 \
          --branch ${{ env.VENDOR_BRANCH }} \
          $GITHUB_WORKSPACE/vendor_modules

    # ────────────────────────────────────────────────────────────────────────
    # 3. Install build dependencies
    # ────────────────────────────────────────────────────────────────────────
    - name: Install build dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex \
          git libssl-dev libelf-dev lz4 python3 \
          zip zlib1g-dev binutils-aarch64-linux-gnu \
          aarch64-linux-gnu-gcc

    # ────────────────────────────────────────────────────────────────────────
    # 4. Download Clang r383902b1 (exact version baked into your device config)
    #    We download the tarball directly instead of cloning the full prebuilts
    #    repo (which is 30 GB+) — this is ~500 MB and takes ~1-2 min.
    # ────────────────────────────────────────────────────────────────────────
    - name: Download Clang r383902b1 toolchain
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchain/clang
        cd $GITHUB_WORKSPACE/toolchain

        echo "Downloading Clang tarball..."
        for attempt in 1 2 3; do
          curl -fL --retry 3 --retry-delay 10 \
            "${{ env.CLANG_URL }}" \
            -o clang.tar.gz && break
          echo "Attempt $attempt failed, retrying in 15s..."
          sleep 15
        done

        echo "Extracting Clang..."
        tar -xf clang.tar.gz -C clang
        echo "Clang version:"
        $GITHUB_WORKSPACE/toolchain/clang/bin/clang --version

    # ────────────────────────────────────────────────────────────────────────
    # 5. Set common build environment variables
    # ────────────────────────────────────────────────────────────────────────
    - name: Set build environment
      run: |
        echo "PATH=$GITHUB_WORKSPACE/toolchain/clang/bin:$PATH" >> $GITHUB_ENV
        echo "ARCH=arm64"                            >> $GITHUB_ENV
        echo "SUBARCH=arm64"                         >> $GITHUB_ENV
        echo "LLVM=1"                                >> $GITHUB_ENV
        echo "LLVM_IAS=1"                            >> $GITHUB_ENV
        # aarch64-linux-gnu- is the correct prefix for AOSP Clang cross-builds
        echo "CROSS_COMPILE=aarch64-linux-gnu-"      >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-"       >> $GITHUB_ENV
        echo "KDIR=$GITHUB_WORKSPACE/kernel_source"  >> $GITHUB_ENV
        echo "OUT=$GITHUB_WORKSPACE/kernel_source/out" >> $GITHUB_ENV

    # ────────────────────────────────────────────────────────────────────────
    # 6. Generate .config from defconfig
    #    The config is already at arch/arm64/configs/vendor/lahaina-qgki_defconfig
    #    inside your fork — no copy step needed.
    # ────────────────────────────────────────────────────────────────────────
    - name: Generate kernel .config
      working-directory: ${{ github.workspace }}/kernel_source
      run: |
        make O=out \
          ARCH=${{ env.ARCH }} \
          LLVM=${{ env.LLVM }} \
          LLVM_IAS=${{ env.LLVM_IAS }} \
          CROSS_COMPILE=${{ env.CROSS_COMPILE }} \
          CLANG_TRIPLE=${{ env.CLANG_TRIPLE }} \
          ${{ env.DEFCONFIG }}

        echo ".config generated. Relevant lines:"
        grep -E "^CONFIG_LOCALVERSION|^CONFIG_CC_VERSION" out/.config || true

    # ────────────────────────────────────────────────────────────────────────
    # 7. Build the kernel image + DTBs
    # ────────────────────────────────────────────────────────────────────────
    - name: Build kernel (Image + dtbs)
      working-directory: ${{ github.workspace }}/kernel_source
      run: |
        make -j$(nproc --all) O=out \
          ARCH=${{ env.ARCH }} \
          LLVM=${{ env.LLVM }} \
          LLVM_IAS=${{ env.LLVM_IAS }} \
          CROSS_COMPILE=${{ env.CROSS_COMPILE }} \
          CLANG_TRIPLE=${{ env.CLANG_TRIPLE }} \
          Image dtbs 2>&1 | tee $GITHUB_WORKSPACE/build.log

        # Verify the kernel image was produced
        if [ ! -f out/arch/arm64/boot/Image ]; then
          echo "ERROR: Kernel Image not found — build failed!"
          tail -50 $GITHUB_WORKSPACE/build.log
          exit 1
        fi
        echo "Kernel Image size: $(du -h out/arch/arm64/boot/Image)"

    # ────────────────────────────────────────────────────────────────────────
    # 8. Build in-tree kernel modules (*.ko)
    # ────────────────────────────────────────────────────────────────────────
    - name: Build kernel modules
      working-directory: ${{ github.workspace }}/kernel_source
      run: |
        make -j$(nproc --all) O=out \
          ARCH=${{ env.ARCH }} \
          LLVM=${{ env.LLVM }} \
          LLVM_IAS=${{ env.LLVM_IAS }} \
          CROSS_COMPILE=${{ env.CROSS_COMPILE }} \
          CLANG_TRIPLE=${{ env.CLANG_TRIPLE }} \
          modules

        echo "In-tree modules built:"
        find out -name "*.ko" | wc -l

    # ────────────────────────────────────────────────────────────────────────
    # 9. Build vendor (out-of-tree) modules
    #    OnePlus vendor modules use a Kbuild/Makefile system that needs the
    #    built kernel tree as reference via KERNEL_SRC + M=.
    # ────────────────────────────────────────────────────────────────────────
    - name: Build vendor modules (out-of-tree)
      run: |
        VENDOR_MODULES_BUILT=0

        # Try each subdirectory that contains a Kbuild or Makefile
        for mod_dir in $GITHUB_WORKSPACE/vendor_modules/*/; do
          if [ -f "$mod_dir/Kbuild" ] || [ -f "$mod_dir/Makefile" ]; then
            echo "Building vendor module in: $mod_dir"
            make -j$(nproc --all) \
              -C $GITHUB_WORKSPACE/kernel_source/out \
              M="$mod_dir" \
              ARCH=${{ env.ARCH }} \
              LLVM=${{ env.LLVM }} \
              LLVM_IAS=${{ env.LLVM_IAS }} \
              CROSS_COMPILE=${{ env.CROSS_COMPILE }} \
              CLANG_TRIPLE=${{ env.CLANG_TRIPLE }} \
              KERNEL_SRC=$GITHUB_WORKSPACE/kernel_source \
              modules || echo "Warning: module build failed in $mod_dir (continuing)"
            VENDOR_MODULES_BUILT=$((VENDOR_MODULES_BUILT + 1))
          fi
        done

        echo "Vendor module directories attempted: $VENDOR_MODULES_BUILT"
        echo "All *.ko found:"
        find $GITHUB_WORKSPACE/vendor_modules -name "*.ko" | tee $GITHUB_WORKSPACE/vendor_ko_list.txt
        wc -l $GITHUB_WORKSPACE/vendor_ko_list.txt

    # ────────────────────────────────────────────────────────────────────────
    # 10. Collect DTB files
    # ────────────────────────────────────────────────────────────────────────
    - name: Collect DTB blobs
      run: |
        mkdir -p $GITHUB_WORKSPACE/dtbs
        find $GITHUB_WORKSPACE/kernel_source/out/arch/arm64/boot/dts \
          -name "*.dtb" -exec cp {} $GITHUB_WORKSPACE/dtbs/ \; 2>/dev/null || true
        echo "DTB files collected: $(ls $GITHUB_WORKSPACE/dtbs | wc -l)"

    # ────────────────────────────────────────────────────────────────────────
    # 11. Set up AnyKernel3 for flashing via TWRP
    # ────────────────────────────────────────────────────────────────────────
    - name: Set up AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git \
          --depth=1 \
          $GITHUB_WORKSPACE/anykernel

        cd $GITHUB_WORKSPACE/anykernel

        # Remove any stock placeholder files
        rm -f Image zImage Image.gz Image.gz-dtb dtb dtbo.img

        # Configure anykernel.sh for OnePlus 9 Pro
        cat > anykernel.sh << 'AKSH'
        # AnyKernel3 - Script for OnePlus 9 Pro (lemonadep) - Android 14
        # osm0sis @ xda-developers

        ## AnyKernel setup
        kernel.string=Stock Base Kernel - OnePlus 9 Pro (Android 14)
        do.devicecheck=1
        do.modules=1
        do.systemless=1
        do.cleanup=1
        do.cleanuponabort=0

        ## Device check
        device.name1=lemonadep
        device.name2=lemonade
        device.name3=
        device.name4=
        device.name5=

        ## Permissions
        supported.versions=14
        supported.patchlevels=

        ## AnyKernel methods (don't change)
        . tools/ak3-core.sh

        ## AnyKernel install
        split_boot
        flash_boot
        AKSH

    # ────────────────────────────────────────────────────────────────────────
    # 12. Copy build artifacts into AnyKernel3 package
    # ────────────────────────────────────────────────────────────────────────
    - name: Assemble flashable package
      run: |
        AK=$GITHUB_WORKSPACE/anykernel

        # Kernel image
        cp $GITHUB_WORKSPACE/kernel_source/out/arch/arm64/boot/Image $AK/

        # DTB files (AnyKernel3 expects them in /dtbs/)
        if [ "$(ls $GITHUB_WORKSPACE/dtbs/*.dtb 2>/dev/null | wc -l)" -gt "0" ]; then
          mkdir -p $AK/dtbs
          cp $GITHUB_WORKSPACE/dtbs/*.dtb $AK/dtbs/
          echo "Copied $(ls $AK/dtbs | wc -l) DTB files"
        fi

        # Vendor modules (AnyKernel3 do.modules=1 expects this path)
        mkdir -p $AK/modules/vendor/lib/modules
        find $GITHUB_WORKSPACE/vendor_modules -name "*.ko" \
          -exec cp {} $AK/modules/vendor/lib/modules/ \;
        find $GITHUB_WORKSPACE/kernel_source/out -name "*.ko" \
          -exec cp {} $AK/modules/vendor/lib/modules/ \;
        echo "Modules packaged: $(ls $AK/modules/vendor/lib/modules | wc -l)"

    # ────────────────────────────────────────────────────────────────────────
    # 13. Create the final flashable ZIP
    # ────────────────────────────────────────────────────────────────────────
    - name: Create flashable ZIP
      run: |
        cd $GITHUB_WORKSPACE/anykernel
        ZIP_NAME="Stock-Base-OP9Pro-$(date +%Y%m%d-%H%M).zip"
        zip -r9 $GITHUB_WORKSPACE/$ZIP_NAME . \
          --exclude=".git/*" \
          --exclude="README.md" \
          --exclude="*placeholder"

        echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
        echo "Flashable ZIP size: $(du -h $GITHUB_WORKSPACE/$ZIP_NAME)"

    # ────────────────────────────────────────────────────────────────────────
    # 14. Upload artifacts
    # ────────────────────────────────────────────────────────────────────────
    - name: Upload flashable kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Stock-Base-Kernel-OP9Pro
        path: ${{ github.workspace }}/${{ env.ZIP_NAME }}
        retention-days: 30

    - name: Upload build log (for debugging)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: ${{ github.workspace }}/build.log
        retention-days: 7
        
