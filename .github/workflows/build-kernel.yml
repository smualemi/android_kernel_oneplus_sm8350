name: Build Kernel

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v3
        with:
          repository: OnePlusOSS/android_kernel_oneplus_sm8350
          ref: oneplus/sm8350_u_14.0.0_oneplus9

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev make \
            python3 zip binutils-aarch64-linux-gnu

      - name: Download Clang toolchain
        run: |
          mkdir clang
          # Download clang-r383902b1 matching your config
          wget -q <clang_r383902b1_prebuilt_url> -O clang.tar.gz
          tar -xf clang.tar.gz -C clang --strip-components=1

      - name: Copy defconfig
        run: cp /path/to/your/config arch/arm64/configs/vendor/lahaina-qgki_defconfig

      - name: Build kernel
        run: |
          export PATH="$PWD/clang/bin:$PATH"
          make O=out ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            vendor/lahaina-qgki_defconfig

          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu-

      - name: Package with AnyKernel3
        run: |
          cp out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3 && zip -r9 kernel-op9pro.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: kernel-op9pro
          path: AnyKernel3/kernel-op9pro.zip
